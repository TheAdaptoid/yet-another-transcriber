version: "1.0"
project: "Yet Another Transcriber"
description: "Project-specific technical vocabulary for local dictation."

technical_names:
  - term: "Yet Another Transcriber"
    part_of_speech: "noun"
    category: "software"
    definition: "The Windows application that changes local speech into text."
  - term: "dictation"
    part_of_speech: "noun"
    category: "process"
    definition: "The process of speaking to produce text."
  - term: "utterance"
    part_of_speech: "noun"
    category: "process"
    definition: "Speech recorded in one dictation session."
  - term: "transcript"
    part_of_speech: "noun"
    category: "software"
    definition: "The text produced from recorded speech."
  - term: "speech recognition"
    part_of_speech: "noun"
    category: "process"
    definition: "The process of changing recorded speech into text."
  - term: "voice activity detection"
    part_of_speech: "noun"
    category: "process"
    definition: "The process of detecting speech in recorded audio."
  - term: "VAD"
    part_of_speech: "noun"
    category: "process"
    definition: "Abbreviation for voice activity detection."
  - term: "Silero VAD"
    part_of_speech: "noun"
    category: "software"
    definition: "The local voice activity detection model used by the application."
  - term: "whisper.cpp"
    part_of_speech: "noun"
    category: "software"
    definition: "The speech recognition software used by the application."
  - term: "whisper-cli"
    part_of_speech: "noun"
    category: "tool"
    definition: "The command-line program that runs local speech recognition."
  - term: "base.en"
    part_of_speech: "noun"
    category: "software"
    definition: "The English speech recognition model used by the application."
  - term: "hotkey"
    part_of_speech: "noun"
    category: "UI"
    definition: "A key combination that starts or stops recording."
  - term: "indicator"
    part_of_speech: "noun"
    category: "UI"
    definition: "The application window that shows recording, processing, or error status."
  - term: "focused element"
    part_of_speech: "noun"
    category: "UI"
    definition: "The user interface element that currently receives keyboard input."
  - term: "clipboard"
    part_of_speech: "noun"
    category: "software"
    definition: "The Windows storage area used to transfer text between applications."
  - term: "Windows Terminal"
    part_of_speech: "noun"
    category: "software"
    definition: "A supported terminal application for text insertion."
  - term: "manifest"
    part_of_speech: "noun"
    category: "software"
    definition: "The local file with version and hash data for speech assets."
  - term: "WAV"
    part_of_speech: "noun"
    category: "software"
    definition: "The audio file format used for temporary recordings."

technical_verbs:
  - term: "transcribe"
    part_of_speech: "verb"
    definition: "Change recorded speech into text with speech recognition."
    approved_usage: "Transcribe the recorded speech."

forbidden_project_words: []
